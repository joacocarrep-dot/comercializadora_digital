version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comercializadora-app
    ports:
      - "8000:8000"
    volumes:
      # Montar el código fuente para hot-reload
      - ./backend:/app/backend
    environment:
      # Cargar variables desde archivo .env
      - PYTHONPATH=/app/backend
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENV=${ENV}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - comercializadora-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: comercializadora-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: comercializadora
    volumes:
      # Persistencia de datos
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d comercializadora"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - comercializadora-network
    restart: unless-stopped

networks:
  comercializadora-network:
    driver: bridge